<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課題デモ - cocowa</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #ffffff;
        --line: #dfe4ea;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }

      h1 {
        margin: 0 0 26px;
        text-align: center;
        font-size: 32px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(31, 41, 55, 0.12);
      }

      .card-header {
        background: var(--accent-soft);
        border-bottom: 1px solid var(--line);
        padding: 18px 18px 14px;
      }

      .card-header h2 {
        margin: 0;
        font-size: 22px;
      }

      .card-body {
        padding: 18px;
        font-size: 16px;
        line-height: 1.7;
        color: var(--muted);
      }

      .detail {
        margin-top: 24px;
        display: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 20px 22px;
      }

      .detail.open {
        display: block;
      }

      .detail h3 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      .detail p {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.8;
      }

      .summary {
        margin-top: 28px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 20px 22px;
        font-size: 18px;
        line-height: 1.8;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>課題</h1>

      <div class="grid">
        <article class="card" data-type="lunch">
          <div class="card-header">
            <h2>昼</h2>
          </div>
          <div class="card-body">
            着いてから行列と分かり、昼休みを使い切ってしまう
          </div>
        </article>

        <article class="card" data-type="return">
          <div class="card-header">
            <h2>帰り</h2>
          </div>
          <div class="card-body">
            限定商品が売り切れかどうか、お店に着くまで分からない
          </div>
        </article>

        <article class="card" data-type="holiday">
          <div class="card-header">
            <h2>休日</h2>
          </div>
          <div class="card-body">
            行きたいお店の混み具合が読めず、時間の計画が立てにくい
          </div>
        </article>
      </div>

      <div id="detail" class="detail" aria-live="polite"></div>

      <div class="summary">
        根本の課題は、「いま」の待ち時間や商品の残りを知る手段がないこと（確認できた既存の混雑情報は、統計にもとづく目安が中心）
      </div>
    </div>

    <script>
      const details = {
        lunch: {
          title: '昼',
          text: '昼に着いてから行列と分かり、昼休みを使い切ってしまう。時間が限られていると、並ぶことだけで休憩の価値が失われる。'
        },
        return: {
          title: '帰り',
          text: '限定商品が売り切れかどうか、お店に着くまで分からない。行きたい買い物があるとき、現地での失敗が大きくなる。'
        },
        holiday: {
          title: '休日',
          text: '行きたいお店の混み具合が読めず、時間の計画が立てにくい。リスクを前もって知りたい。'
        }
      };

      const detailBox = document.getElementById('detail');

      document.querySelectorAll('.card').forEach((card) => {
        card.addEventListener('click', () => {
          const key = card.dataset.type;
          const item = details[key];
          if (!item) return;

          const opened = detailBox.classList.contains('open');
          const same = detailBox.dataset.type === key;

          if (opened && same) {
            detailBox.classList.remove('open');
            detailBox.removeAttribute('data-type');
            detailBox.innerHTML = '';
            return;
          }

          detailBox.dataset.type = key;
          detailBox.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.text}</p>
          `;
          detailBox.classList.add('open');
        });
      });
    </script>
  </body>
</html>
