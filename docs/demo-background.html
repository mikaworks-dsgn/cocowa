<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>背景デモ - cocowa</title>
    <style>
      :root {
        --bg: #f7f7f7;
        --panel: #ffffff;
        --line: #dfe4ea;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #4f46e5;
        --accent-soft: #eef2ff;
        --shadow: 0 8px 20px rgba(31, 41, 55, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 60px;
      }

      h1 {
        margin: 0 0 28px;
        text-align: center;
        font-size: 32px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 18px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(31, 41, 55, 0.12);
      }

      .card-header {
        background: var(--accent-soft);
        border-bottom: 1px solid var(--line);
        padding: 18px 18px 14px;
      }

      .card-header h2 {
        margin: 0;
        font-size: 22px;
      }

      .number {
        display: block;
        font-size: 42px;
        font-weight: 700;
        text-align: center;
        padding: 26px 18px 0;
        color: var(--accent);
      }

      .card-body {
        padding: 14px 18px 20px;
        font-size: 16px;
        line-height: 1.7;
        color: var(--muted);
        text-align: center;
      }

      .detail {
        margin-top: 24px;
        display: none;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 20px 22px;
      }

      .detail.open {
        display: block;
      }

      .detail h3 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      .detail p {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.8;
      }

      .source {
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>背景</h1>

      <div class="grid">
        <article class="card" data-item="workers">
          <div class="card-header">
            <h2>丸の内の就業者数</h2>
          </div>
          <span class="number">約28万人</span>
          <div class="card-body">丸の内周辺（大丸有地区）で働く人は約28万人（2019年時点）</div>
        </article>

        <article class="card" data-item="lunch">
          <div class="card-header">
            <h2>昼休みの実態</h2>
          </div>
          <span class="number">56.3%</span>
          <div class="card-body">会社員の56.3%が、昼休みを十分に取れていない</div>
        </article>

        <article class="card" data-item="waiting">
          <div class="card-header">
            <h2>待ち時間の意識</h2>
          </div>
          <span class="number">18.8分</span>
          <div class="card-body">理想は63.1分、実際は44.3分（差18.8分）</div>
        </article>
      </div>

      <div id="detail" class="detail" aria-live="polite"></div>
    </div>

    <script>
      const details = {
        workers: {
          title: '丸の内の就業者数',
          text: '丸の内周辺（大丸有地区）で働く人は約28万人（2019年時点）。昼休みの利用者が多いエリアであることが背景にある。',
          source: '出典：三菱地所 資料（2019年4月）'
        },
        lunch: {
          title: '昼休みの実態',
          text: '会社員の56.3%が、昼休みを十分に取れていない。理想は63.1分、実際は44.3分で、差は18.8分。昼休みの時間を使って、待ち時間の不安を減らしたいという背景がある。',
          source: '出典：アサヒグループ食品「働く人のお昼休憩に関する実態調査」（2023年5月）'
        },
        waiting: {
          title: '待ち時間の意識',
          text: '待ち時間が事前に分かる環境が広がり、待つことへの余裕が生まれているという分析もある。今の状況が分かると、時間の使い方が変わる。',
          source: '出典：シチズン時計「待ち時間」に関する調査（2023年、Forbes JAPAN掲載）'
        }
      };

      const detailBox = document.getElementById('detail');

      document.querySelectorAll('.card').forEach((card) => {
        card.addEventListener('click', () => {
          const key = card.dataset.item;
          const item = details[key];
          if (!item) return;

          const opened = detailBox.classList.contains('open');
          const same = detailBox.dataset.item === key;

          if (opened && same) {
            detailBox.classList.remove('open');
            detailBox.removeAttribute('data-item');
            detailBox.innerHTML = '';
            return;
          }

          detailBox.dataset.item = key;
          detailBox.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.text}</p>
            <p class="source">${item.source}</p>
          `;
          detailBox.classList.add('open');
        });
      });
    </script>
  </body>
</html>
